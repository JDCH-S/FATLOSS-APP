<title>Cut Block Planner</title>
<meta name="description" content="Fat-loss tracker: cut and maintenance-break blocks, adaptive weekly check-ins, a fixed daily meal plan and Belgian grocery costs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --surface-2: #eceff3;
    --ink: #151a1f;
    --ink-2: #414b56;
    --muted: #66717d;
    --line: #d6dce2;
    --line-2: #e6eaee;
    --accent: #2b58a6;
    --accent-ink: #ffffff;
    --accent-soft: #e2eaf7;
    --good: #22744a;
    --good-soft: #e0f1e7;
    --warn: #8f5a00;
    --warn-soft: #fbefd8;
    --bad: #ad2f2c;
    --bad-soft: #fae3e2;
    --chart-dot: #8e99a5;
    --chart-avg: #2b58a6;
    --chart-target: #22744a;
    --chart-goal: #8f5a00;
    --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 6px;
    --fs-xs: 12px;
    --fs-sm: 13px;
    --fs-base: 14px;
    --fs-md: 16px;
    --fs-lg: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1215;
      --surface: #161a1f;
      --surface-2: #1d2228;
      --ink: #e6eaee;
      --ink-2: #b6bfc8;
      --muted: #8d98a4;
      --line: #2c333b;
      --line-2: #232930;
      --accent: #8aaae6;
      --accent-ink: #0f1215;
      --accent-soft: #1d2a3e;
      --good: #6cc794;
      --good-soft: #15291e;
      --warn: #e3b25e;
      --warn-soft: #2d2413;
      --bad: #ef8a84;
      --bad-soft: #321b1a;
      --chart-dot: #6f7a86;
      --chart-avg: #8aaae6;
      --chart-target: #6cc794;
      --chart-goal: #e3b25e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1215;
    --surface: #161a1f;
    --surface-2: #1d2228;
    --ink: #e6eaee;
    --ink-2: #b6bfc8;
    --muted: #8d98a4;
    --line: #2c333b;
    --line-2: #232930;
    --accent: #8aaae6;
    --accent-ink: #0f1215;
    --accent-soft: #1d2a3e;
    --good: #6cc794;
    --good-soft: #15291e;
    --warn: #e3b25e;
    --warn-soft: #2d2413;
    --bad: #ef8a84;
    --bad-soft: #321b1a;
    --chart-dot: #6f7a86;
    --chart-avg: #8aaae6;
    --chart-target: #6cc794;
    --chart-goal: #e3b25e;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: var(--fs-base);
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 0 48px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
  h2 { font-size: var(--fs-lg); }
  h3 { font-size: var(--fs-md); }
  p { margin: 0; }
  a { color: var(--accent); }
  .num, td.n, th.n { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: var(--fs-sm); }
  .muted { color: var(--muted); }
  .small { font-size: var(--fs-sm); }
  .xs { font-size: var(--fs-xs); }
  .label { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }

  /* header */
  .top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    margin-inline: -16px;
    padding-inline: 16px;
  }
  .top-inner { max-width: 1120px; margin: 0 auto; display: grid; gap: 8px; padding-block: 12px 0; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand h1 { font-size: var(--fs-md); letter-spacing: 0.01em; }
  .status-strip { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: var(--fs-sm); color: var(--ink-2); }
  .status-strip b { color: var(--ink); font-weight: 600; }
  .save-state { font-size: var(--fs-xs); color: var(--muted); }
  .save-state.error { color: var(--bad); }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 8px 12px 9px; font: inherit; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  /* chips */
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
    font-size: var(--fs-xs); font-weight: 500; line-height: 20px; white-space: nowrap;
    background: var(--surface-2); color: var(--ink-2);
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }

  /* layout */
  main { display: grid; gap: 28px; padding-top: 20px; }
  section.block { display: grid; gap: 12px; }
  .block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .grid { display: grid; gap: 12px 16px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stack { display: grid; gap: 8px; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; }
  .kv > div { display: grid; gap: 2px; }
  .kv .v { font-size: var(--fs-md); font-weight: 600; font-variant-numeric: tabular-nums; }
  .note { font-size: var(--fs-sm); color: var(--ink-2); max-width: 72ch; }
  .banner { padding: 10px 14px; border-radius: var(--radius); font-size: var(--fs-sm); border: 1px solid var(--line); background: var(--surface); }
  .banner.warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
  .banner.bad { background: var(--bad-soft); border-color: transparent; color: var(--ink); }
  .banner.info { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
  .banner.good { background: var(--good-soft); border-color: transparent; color: var(--ink); }

  /* forms */
  label.field { display: grid; gap: 4px; font-size: var(--fs-sm); color: var(--ink-2); }
  input[type="number"], input[type="text"], input[type="date"], input[type="search"], select, textarea {
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 6px 8px; min-width: 0; width: 100%;
  }
  input[type="number"] { font-variant-numeric: tabular-nums; }
  textarea { font-family: var(--mono); font-size: var(--fs-xs); min-height: 160px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .tab:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .btn {
    appearance: none; font: inherit; font-weight: 500; font-size: var(--fs-sm); cursor: pointer;
    padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--bad); }
  .btn.ghost { border-color: transparent; background: none; padding-inline: 6px; color: var(--accent); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); flex-wrap: wrap; }
  .seg button {
    appearance: none; border: 0; background: none; font: inherit; font-size: var(--fs-sm); padding: 5px 10px; cursor: pointer; color: var(--ink-2);
    border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg.tri button[aria-pressed="true"][data-v="exclude"] { background: var(--bad); color: #fff; }
  .days { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .days button {
    appearance: none; font: inherit; font-size: var(--fs-xs); width: 40px; padding: 5px 0; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer;
  }
  .days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* tables */
  .tscroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  th { font-size: var(--fs-xs); font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; background: var(--surface); white-space: nowrap; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tfoot td, tr.total td { font-weight: 600; border-top: 1px solid var(--line); background: var(--surface-2); }
  tr.sub td { background: var(--surface-2); font-weight: 500; }
  td .sub, th .sub { display: block; font-size: var(--fs-xs); color: var(--muted); }
  th .sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
  td input[type="number"], td input[type="text"], td input[type="date"], td select { padding: 4px 6px; font-size: var(--fs-sm); }
  td.formula { font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-2); min-width: 280px; }
  .over { color: var(--bad); }
  .under { color: var(--warn); }
  .ok { color: var(--good); }

  /* meals */
  .meals { display: grid; gap: 14px; }
  .meal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 8px 10px 0; }
  .role { font-size: var(--fs-xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  /* chart */
  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
  .chart .c-grid { stroke: var(--line-2); stroke-width: 1; fill: none; }
  .chart .c-dot { fill: var(--chart-dot); stroke: none; }
  .chart .c-avg { stroke: var(--chart-avg); stroke-width: 2.2; fill: none; stroke-linejoin: round; }
  .chart .c-target { stroke: var(--chart-target); stroke-width: 1.6; stroke-dasharray: 6 4; fill: none; }
  .chart .c-goal { stroke: var(--chart-goal); stroke-width: 1; fill: none; }
  .chart .c-today { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--ink-2); }
  .legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
  .legend i.lg-dot { width: 6px; height: 6px; border: 0; border-radius: 50%; background: var(--chart-dot); }
  details > summary { cursor: pointer; list-style-position: inside; }
  details > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul.note { margin: 0; padding-left: 18px; }

  .timeline { display: grid; gap: 4px; }
  .timeline .t { display: grid; grid-template-columns: 170px 1fr auto; gap: 10px; align-items: center; font-size: var(--fs-sm); padding: 5px 8px; border-radius: var(--radius); }
  .timeline .t.now { background: var(--accent-soft); }
  @media (max-width: 560px) {
    .timeline .t { grid-template-columns: 1fr; gap: 2px; }
    .status-strip { gap: 4px 10px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>Cut Block Planner</h1>
      <span id="save-state" class="save-state" role="status" aria-live="polite">Loading…</span>
    </div>
    <div id="status-strip" class="status-strip" aria-live="polite"></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-setup" data-tab="setup" aria-selected="true">Setup</button>
      <button class="tab" role="tab" id="tab-log" data-tab="log" aria-selected="false">Daily Log</button>
      <button class="tab" role="tab" id="tab-checkin" data-tab="checkin" aria-selected="false">Weekly Check-in</button>
      <button class="tab" role="tab" id="tab-plan" data-tab="plan" aria-selected="false">Meal Plan</button>
      <button class="tab" role="tab" id="tab-groceries" data-tab="groceries" aria-selected="false">Groceries</button>
    </nav>
  </div>
</div>

<div class="wrap">
  <main id="view" role="tabpanel" aria-live="off">
    <p class="muted">Loading your data…</p>
  </main>
</div>
<!-- File pickers live outside the re-rendered view so a re-render can never swap them out mid-pick. -->
<input type="file" id="file-prices" class="hidden-file" accept="application/json,.json" tabindex="-1" aria-hidden="true">
<input type="file" id="file-backup" class="hidden-file" accept="application/json,.json" tabindex="-1" aria-hidden="true">

<script src="js/products.js"></script>
<script src="js/engine.js"></script>
<script src="js/mealplan.js"></script>
<script src="js/groceries.js"></script>
<script src="js/store.js"></script>
